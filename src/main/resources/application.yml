spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3s

server:
  port: ${PORT:3003}

customer:
  service:
    # Empty (default) = Customer and Ledger share this JVM, KYC lookup is in-process.
    # Set to the Customer Service URL if deployed separately: HTTP lookup, 5 s timeout, 503 when unreachable.
    url: ${CUSTOMER_SERVICE_URL:}

ledger:
  service:
    # Empty (default) = Customer and Ledger share this JVM and accounts are read in-process.
    # Set to the Ledger Service URL if deployed separately: GET /api/accounts?customerId= with the SYSTEM key.
    url: ${LEDGER_SERVICE_URL:}

system:
  # Identity and secret this service sends (X-Service-Id / X-Service-Key) to the Ledger Service.
  # The Ledger Service must list  customer-service=<secret>  in its SYSTEM_KEYS.
  service-id: ${CUSTOMER_SERVICE_ID:customer-service}
  token:
    secret: ${SYSTEM_TOKEN_SECRET:}

qstash:
  topic-url: ${QSTASH_TOPIC_URL}
  token: ${QSTASH_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-next: ${JWT_PUBLIC_KEY_NEXT:}
    issuer: ${JWT_ISSUER:novo-auth}
    revocation-fail-open: ${JWT_REVOCATION_FAIL_OPEN:false}
  system:
    keys: ${SYSTEM_KEYS:}
    service-id: ${SERVICE_ID:}
    service-key: ${SERVICE_KEY:}
