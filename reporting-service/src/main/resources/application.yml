spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3s

server:
  port: ${PORT:3011}

supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:reports}
    signed-url-duration-seconds: ${SUPABASE_STORAGE_SIGNED_URL_DURATION:86400}

qstash:
  verify-signatures: ${QSTASH_VERIFY_SIGNATURES:true}
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY:}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY:}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-next: ${JWT_PUBLIC_KEY_NEXT:}
    issuer: ${JWT_ISSUER:novo-auth}
  system:
    service-id: ${SERVICE_ID:reporting-service}
    service-key: ${SYSTEM_TOKEN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
