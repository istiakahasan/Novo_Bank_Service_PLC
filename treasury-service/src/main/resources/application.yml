spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: treasury-service
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3s

server:
  port: ${PORT:3010}

ledger:
  service:
    url: ${LEDGER_SERVICE_URL}

treasury:
  deposit-rate-bps: ${DEPOSIT_RATE_BPS:300}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-next: ${JWT_PUBLIC_KEY_NEXT:}
    issuer: ${JWT_ISSUER:novo-auth}
  system:
    service-id: ${SERVICE_ID:treasury-service}
    service-key: ${SYSTEM_TOKEN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
