spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # db/006_auth_server.sql creates the tables in this schema so they cannot collide with the
        # auth_users / refresh_tokens tables of the older auth-service. Set AUTH_DB_SCHEMA=public to use public.
        default_schema: ${AUTH_DB_SCHEMA:auth_v2}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3s

server:
  port: ${PORT:3008}

jwt:
  # RSA private key: PKCS#8 or PKCS#1, PEM text, base64 of the PEM, or base64 of the DER
  private-key: ${JWT_PRIVATE_KEY}
  # optional; must belong to the private key (checked at startup). Derived from the private key if empty.
  public-key: ${JWT_PUBLIC_KEY:}
  access-ttl-seconds: 900
  refresh-ttl-seconds: 604800
  issuer: banking-auth

auth:
  # Needed once to create the first STAFF user (header X-Bootstrap-Secret). Empty = bootstrap disabled.
  bootstrap-secret: ${AUTH_BOOTSTRAP_SECRET:}
  max-failed-attempts: 5
  lock-minutes: 15
  login-rate-limit-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
