name: supabase-keepalive

# Supabase free projects pause after 7 days without activity. This touches the database daily.
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_DB_URL = postgresql://postgres.<ref>:<url-encoded-password>@aws-0-<region>.pooler.supabase.com:5432/postgres
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL secret is not set"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select now() as ping, (select count(*) from accounts) as accounts;"
