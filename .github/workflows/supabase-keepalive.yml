name: supabase-keepalive

# Supabase free projects pause after 7 days without activity. This touches the database daily.
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_DB_URL = postgresql://postgres.<ref>:<url-encoded-password>@aws-0-<region>.pooler.supabase.com:5432/postgres
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version

      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          # GitHub runners have no IPv6: use the Supabase pooler URL (aws-0-<region>.pooler.supabase.com), not db.<ref>.supabase.co.
          # Retry to ride out transient network errors. Only SELECT now() so a missing table can't fail the check.
          for i in 1 2 3; do
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select now() as ping;"; then exit 0; fi
            echo "Attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "::error::Could not connect. Check the SUPABASE_DB_URL secret (pooler host, URL-encoded password, project not paused)."
          exit 1
