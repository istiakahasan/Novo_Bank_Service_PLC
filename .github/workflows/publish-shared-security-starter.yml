name: publish-shared-security-starter

# Publishes shared-security-starter to GitHub Packages (Maven) whenever the library changes on main.
on:
  push:
    branches: [main]
    paths:
      - "shared-security-starter/**"
      - ".github/workflows/publish-shared-security-starter.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github                  # must match <distributionManagement><repository><id> in the pom
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Test and publish
        working-directory: shared-security-starter
        run: mvn -B deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
