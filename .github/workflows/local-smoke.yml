name: local-smoke

on:
  pull_request:
    paths:
      - docker-compose.yml
      - init-db.sql
      - services/**
      - wiremock/**
      - scripts/**
      - .env.local.example
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate local keys
        run: ./scripts/make-key.sh
      - name: Start the stack
        env:
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/start-all.sh
      - name: Seed scenario
        run: ./scripts/seed-data.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: ./scripts/stop-all.sh -v
