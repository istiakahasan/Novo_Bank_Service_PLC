spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3s

server:
  port: ${PORT:3005}

customer:
  service:
    url: ${CUSTOMER_SERVICE_URL}

qstash:
  verify-signatures: ${QSTASH_VERIFY_SIGNATURES:true}
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY:}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY:}

fraud:
  high-value-threshold-cents: 500000
  velocity-max-transactions: 10
  velocity-window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
